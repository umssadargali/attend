<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report by Supervisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #102a43;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(16, 42, 67, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            color: #0b69a3;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: #627d98;
            font-weight: 600;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334e68;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #102a43;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0b69a3;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 105, 163, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0b69a3 0%, #074e79 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 105, 163, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(11, 105, 163, 0.35);
        }

        .btn-submit:disabled {
            background: #9fb3c8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .success {
            background-color: #def7ec;
            color: #03543f;
            border: 1px solid #bdf2d5;
        }

        .error {
            background-color: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #fabdbe;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h1>भारत की जनगणना -2027</h1>
        <p>पर्यवेक्षकों द्वारा वास्तविक मकानों की संख्यात्मक प्रतिवेदन</p>
    </div>

    <form id="reportForm">
        <div class="form-group">
            <label for="circleNo">Circle No *</label>
            <select id="circleNo" name="circleNo" required>
                <option value="">-- चुनें / Select --</option>
                <script>
                    for(let i = 1; i <= 92; i++) {
                        document.write(`<option value="${i}">${i}</option>`);
                    }
                </script>
            </select>
        </div>

        <div class="form-group">
            <label for="hlbNo">HLB No</label>
            <input type="text" id="hlbNo" name="hlbNo" placeholder="">
        </div>

        <div class="form-group">
            <label for="enumeratorName">प्रगणक का नाम</label>
            <input type="text" id="enumeratorName" name="enumeratorName" placeholder="">
        </div>

        <div class="form-group">
            <label for="residentialHouse">आवासीय मकानों की संख्या</label>
            <input type="text" id="residentialHouse" name="residentialHouse" placeholder="e.g 123">
        </div>

        <div class="form-group">
            <label for="nonResidentialHouse">गैर-आवासीय मकानों की संख्या</label>
            <input type="text" id="nonResidentialHouse" name="nonResidentialHouse" placeholder="e.g 123">
        </div>

        <div class="form-group">
            <label for="totalAllotedHouse">कुल आवंटित मकानों की संख्या</label>
            <input type="text" id="totalAllotedHouse" name="totalAllotedHouse" placeholder="e.g 123">
        </div>

        <div class="form-group">
            <label for="remarks">अभियुक्ति( कार्य पूर्ण-हां या ना)</label>
            <input type="text" id="remarks" name="remarks" placeholder="Remarks">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Report</button>
    </form>

    <div id="msgBox" class="message"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8IVFitkAopqsQN4QDAME7tF8Gyjq6kbGUCGz6h_LykIsN3W8FMBr2SLYrB2oeOdNXRw/exec";

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('msgBox');
        
        // Instant Response Logic: Form ko turant clear aur success dikhana
        msgBox.className = "message success";
        msgBox.innerText = "Data successfully submitted! (Saving in background...)";
        msgBox.style.display = "block";
        
        // Form Data nikal kar copy kar lena
        const formData = new FormData(this);
        
        // Form ko turant reset kar dena taaki user agli entry kar sake
        document.getElementById('reportForm').reset();
        
        // Background me data send karna (User bina ruke kaam kar sakta hai)
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Speed ko badhane aur pre-flight delay hatane ke liye
            body: new URLSearchParams(formData)
        })
        .catch(error => {
            console.error("Background Sync Error: ", error);
        });
    });
</script>

</body>
</html>
